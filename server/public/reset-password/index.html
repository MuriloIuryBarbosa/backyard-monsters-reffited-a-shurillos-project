<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Recuperar senha | Backyard Monsters Refitted</title>
    <link rel="stylesheet" href="/main.css?v=3" />
    <link rel="stylesheet" href="account.css" />
    <script src="account.js" type="module"></script>
  </head>
  <body>
    <main class="account">
      <a href="/play/">Voltar ao jogo</a>
      <h1>Recuperar senha</h1>
      <form id="request">
        <label for="email">E-mail da conta</label>
        <input id="email" name="email" type="email" autocomplete="email" required />
        <button type="submit">Enviar link</button>
      </form>
      <form id="reset" hidden>
        <label for="password">Nova senha</label>
        <input id="password" name="password" type="password" autocomplete="new-password" aria-describedby="password-help" minlength="8" required />
        <small id="password-help">Use pelo menos 8 caracteres, incluindo um caractere especial.</small>
        <button type="submit">Alterar senha</button>
      </form>
      <p id="feedback" role="status"></p>
    </main>
  </body>
</html>
