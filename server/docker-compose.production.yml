name: bymr-production

volumes:
  db:
  redis:
  caddy-data:
  caddy-config:
  web-logs:

x-database: &database
  DB_NAME: ${DB_NAME:-bym}
  DB_HOST: db
  DB_PORT: 5432
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:?Set a database password}

services:
  proxy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    environment:
      GAME_DOMAIN: ${GAME_DOMAIN:?Set the game domain}
    ports:
      - "${PROXY_BIND_IP:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${PROXY_BIND_IP:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

  web:
    image: ${BYMR_IMAGE:-bymr-production:local}
    build:
      context: .
      target: browser
      additional_contexts:
        game_client: ../bin
    restart: unless-stopped
    environment:
      <<: *database
      ENV: production
      PORT: 3001
      BASE_URL: ${PUBLIC_URL:-https://${GAME_DOMAIN:?Set the game domain}}
      SERVER_URL: ${PUBLIC_URL:-https://${GAME_DOMAIN:?Set the game domain}}
      WEB_URL: ${PUBLIC_URL:-https://${GAME_DOMAIN:?Set the game domain}}
      PROXY_IP_HEADER: X-Forwarded-For
      SECRET_KEY: ${SECRET_KEY:?Set a random session secret}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-30d}
      REQUIRE_DISCORD: ${REQUIRE_DISCORD:-false}
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      REDIS_URL: redis://redis:6379
      CHAT_WS_HOST: web:3010
      CHAT_WS_PORT: 3010
      FLASH_SOCKET_POLICY: 'false'
      CDN_URL: ${CDN_URL:-}
      USE_VERSION_MANAGEMENT: ${USE_VERSION_MANAGEMENT:-disabled}
      SMTP_HOST: ${SMTP_HOST:?Set the SMTP host}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?Set the sender address}
    volumes:
      - web-logs:/app/logs
    healthcheck:
      test: ["CMD", "bun", "-e", "if (!(await fetch('http://127.0.0.1:3001/connection')).ok) process.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  db-init:
    image: ${BYMR_IMAGE:-bymr-production:local}
    command: bun run db:init
    environment:
      <<: *database
      ENV: production
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.1
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bym}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a database password}
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.1
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
